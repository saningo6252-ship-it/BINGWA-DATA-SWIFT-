name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Ensure Android Gradle structure
        run: flutter create --platforms=android --project-name bingwa_data_swift .

      - name: Update Kotlin Gradle plugin version
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/(id "org\.jetbrains\.kotlin\.android" version ")[0-9.]+(")/\12.0.20\2/g' android/settings.gradle
          fi
          if [ -f android/settings.gradle.kts ]; then
            sed -i -E 's/(id\("org\.jetbrains\.kotlin\.android"\) version ")[0-9.]+(")/\12.0.20\2/g' android/settings.gradle.kts
          fi

      - name: Set App Name and Apply Custom Icon
        run: |
          python3 - <<'PY'
          import os, re, subprocess

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = re.sub(r'android:label="[^"]*"', 'android:label="BINGWA DATA SWIFT"', content)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)

          src_icon = "assets/app_icon.png"
          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          if os.path.exists(src_icon):
              for folder, sz in densities.items():
                  out_dir = os.path.join("android/app/src/main", folder)
                  os.makedirs(out_dir, exist_ok=True)
                  for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                      dst = os.path.join(out_dir, name)
                      subprocess.run(["cp", src_icon, dst], check=True)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingwa-data-swift-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
